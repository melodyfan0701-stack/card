<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>歲歲｜Designer Card V3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+TC:wght@400;600;700&display=swap');

:root{
  --ink:#5f5149; --paper:#f8f0e7; --cream:#fffaf5;
  --accent:#b88f7e; --accent2:#9eaaa0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Klee One','Noto Serif TC',serif}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; color:var(--ink); transition:background .55s ease-out;
  background-color:#e7d8ca;
}
.stage{position:relative;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px}
.stage:before,.stage:after{
  content:"";position:fixed;inset:-90px;pointer-events:none;z-index:0;
  background-repeat:repeat;
  transition:opacity .8s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1);
}
.stage:before{
  opacity:.78;
  background-image:
    radial-gradient(circle at 24px 22px,#cda894 0 4px,transparent 4.6px),
    radial-gradient(circle at 31px 17px,#dfbdb0 0 3.5px,transparent 4px),
    radial-gradient(circle at 18px 17px,#dfbdb0 0 3.5px,transparent 4px),
    radial-gradient(circle at 78px 72px,#aab3a8 0 3px,transparent 3.6px),
    radial-gradient(circle at 88px 65px,#c4a18f 0 2px,transparent 2.6px),
    radial-gradient(circle at 68px 83px,#d2b4a4 0 2.5px,transparent 3px),
    radial-gradient(circle at 48px 55px,#cbb09f 0 1.7px,transparent 2.2px);
  background-size:128px 128px;
}
.stage:after{
  opacity:.38;
  transform:translate3d(0,0,0);
  background-image:
    radial-gradient(ellipse at 16px 17px,#c4a18f 0 4px,transparent 4.6px),
    radial-gradient(ellipse at 24px 13px,#d8b7a8 0 3.5px,transparent 4px),
    radial-gradient(ellipse at 12px 12px,#d8b7a8 0 3.5px,transparent 4px),
    radial-gradient(circle at 96px 30px,#aab3a8 0 2.8px,transparent 3.4px),
    radial-gradient(circle at 56px 100px,#d0ad9d 0 2px,transparent 2.6px);
  background-size:154px 154px;
}
body.snack{background-color:#eee2d7}
body.animal{background-color:#dfe4dc}
body.flower{background-color:#eedfdb}
body.animal .stage:before{
  opacity:.66;
  background-image:
    radial-gradient(ellipse at 23px 27px,#9fae9f 0 7px,transparent 7.5px),
    radial-gradient(ellipse at 35px 19px,#b5c0b4 0 6px,transparent 6.5px),
    radial-gradient(circle at 79px 70px,#c5a194 0 3px,transparent 3.5px),
    radial-gradient(circle at 94px 45px,#b6aa9e 0 2px,transparent 2.6px);
  background-size:132px 132px;
  transform:translate3d(-10px,-6px,0);
}
body.flower .stage:before{
  opacity:.68;
  background-image:
    radial-gradient(circle at 25px 29px,#c4958d 0 7px,transparent 7.5px),
    radial-gradient(circle at 32px 23px,#d8aaa2 0 6px,transparent 6.5px),
    radial-gradient(circle at 19px 23px,#d8aaa2 0 6px,transparent 6.5px),
    radial-gradient(circle at 75px 73px,#a8b2a5 0 3px,transparent 3.6px),
    radial-gradient(circle at 84px 66px,#c5a18e 0 2.5px,transparent 3px);
  background-size:138px 138px;
  transform:translate3d(8px,-5px,0) scale(1.02);
}
@keyframes patternDrift{
  0%{background-position:0 0}
  50%{background-position:12px -8px}
  100%{background-position:0 0}
}
.stage:before{animation:patternDrift 16s cubic-bezier(.45,0,.55,1) infinite}
.stage:after{animation:patternDrift 22s cubic-bezier(.45,0,.55,1) infinite reverse}


.card:after{
  content:"✿";position:absolute;bottom:28px;left:34px;color:#c49b8d;
  font-size:17px;opacity:.55;font-family:'Klee One',serif;
  pointer-events:none;transform:rotate(-8deg);
}
.heart{
  position:absolute;top:24px;right:29px;z-index:4;
  width:42px;height:42px;border:0;background:transparent;
  color:#c49b8d;font-size:25px;line-height:1;cursor:pointer;
  font-family:'Klee One',serif;opacity:.72;
  transition:transform .3s cubic-bezier(.16,1,.3,1),color .25s ease-out,filter .3s ease-out;
  -webkit-tap-highlight-color:transparent;
}
.heart:hover{
  transform:translateY(-3px) scale(1.12) rotate(4deg);
  color:#b77f78;
  filter:drop-shadow(0 5px 7px rgba(160,112,103,.18));
}
.heart:active{transform:translateY(1px) scale(.9)}
.heart.clicked{
  animation:heartPop .5s cubic-bezier(.16,1,.3,1) both;
  color:#b77f78;
}
@keyframes heartPop{
  0%{transform:scale(.9)}
  42%{transform:scale(1.3) rotate(-7deg)}
  72%{transform:scale(1.06) rotate(3deg)}
  100%{transform:scale(1.15) rotate(0)}
}
.card{
  position:relative;z-index:2;width:min(440px,92vw);min-height:620px;
  padding:54px 46px 42px;border-radius:28px;background:
      radial-gradient(circle at 20% 15%,rgba(255,255,255,.72),transparent 28%),
      radial-gradient(circle at 80% 85%,rgba(214,187,170,.10),transparent 30%),
      #fffaf5;
  border:1px solid rgba(120,95,80,.12);
  box-shadow:0 12px 22px rgba(91,73,59,.09),0 28px 55px rgba(91,73,59,.16),0 48px 90px rgba(91,73,59,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  animation:cardIn 1.05s cubic-bezier(.16,1,.3,1) both;
  transition:transform .42s cubic-bezier(.16,1,.3,1),box-shadow .42s cubic-bezier(.16,1,.3,1);
}
.card:hover{
  transform:translate3d(var(--mx,0px),var(--my,-8px),0)
    rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  box-shadow:0 15px 25px rgba(91,73,59,.10),0 34px 65px rgba(91,73,59,.18),0 54px 100px rgba(91,73,59,.11);
}
@keyframes cardIn{0%{opacity:0;transform:translate3d(0,30px,0) scale(.94) rotate(-1.4deg)}55%{opacity:1;transform:translate3d(0,-6px,0) scale(1.012) rotate(.35deg)}78%{transform:translate3d(0,2px,0) scale(.998) rotate(-.12deg)}100%{transform:translate3d(0,0,0) scale(1) rotate(0)}}

.avatar{overflow:hidden;position:relative;
  width:112px;height:112px;border-radius:50%;border:2px solid #c9aa9b;
  background:#ead9cd;display:flex;align-items:center;justify-content:center;
  font-size:15px;letter-spacing:2px;color:#856f64;margin-bottom:28px;
  box-shadow:0 9px 20px rgba(112,87,70,.13);
  transition:transform .42s cubic-bezier(.16,1,.3,1),box-shadow .42s cubic-bezier(.16,1,.3,1);
}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}.card:hover .avatar{overflow:hidden;position:relative;transform:translateY(-4px) rotate(-5deg) scale(1.04);box-shadow:0 13px 25px rgba(112,87,70,.18)}
.name{font-family:'Noto Serif TC',serif;font-size:34px;font-weight:600;letter-spacing:6px;margin:0 0 9px}
.role{font-size:15px;letter-spacing:3px;color:#9b8277;margin-bottom:22px}
.desc{font-size:14px;line-height:2;letter-spacing:1.5px;color:#75655d;margin:0 0 34px}
.line{width:58px;height:1px;background:#c9aaa0;margin:0 auto 28px}
.cta{
  border:2px solid transparent;background:#8f756a;color:#fffaf5;border-radius:999px;
  padding:13px 27px;font-family:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;
  outline:none;box-shadow:0 6px 14px rgba(91,73,59,.18);
  transition:
    transform .32s cubic-bezier(.16,1,.3,1),
    box-shadow .32s cubic-bezier(.16,1,.3,1),
    background .3s ease-out,
    border-color .2s ease-out;
  -webkit-tap-highlight-color:transparent;
}
.cta:hover{
  transform:translate3d(0,-4px,0) scale(1.035);
  box-shadow:0 11px 22px rgba(91,73,59,.23);
  background:#7d655b;
}
.cta:focus-visible{
  border-color:#c5a79a;
  box-shadow:0 0 0 4px rgba(197,167,154,.18),0 10px 22px rgba(91,73,59,.2);
}
.cta:active{
  transform:translate3d(0,2px,0) scale(.94);
  border-color:#d7b8aa;
  box-shadow:0 2px 6px rgba(91,73,59,.16);
}
.cta.clicked{
  animation:buttonBounce .62s cubic-bezier(.16,1,.3,1) both;
  border-color:#d7b8aa;
  box-shadow:
    0 0 0 5px rgba(215,184,170,.13),
    0 9px 20px rgba(91,73,59,.22);
}
@keyframes buttonBounce{
  0%{transform:translate3d(0,2px,0) scale(.94)}
  42%{transform:translate3d(0,-5px,0) scale(1.045)}
  72%{transform:translate3d(0,1px,0) scale(.99)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
.controls{position:fixed;z-index:3;bottom:24px;display:flex;gap:11px;padding:9px 13px;border-radius:999px;background:rgba(255,250,245,.76);backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(91,73,59,.12)}
.dot{width:17px;height:17px;border-radius:50%;border:1px solid rgba(80,60,50,.18);cursor:pointer;transition:transform .3s cubic-bezier(.22,.8,.25,1),box-shadow .3s ease-out}
.dot:hover{transform:translateY(-4px) scale(1.15);box-shadow:0 5px 10px rgba(70,55,45,.18)}

@keyframes snackCard{0%{opacity:0;transform:translate3d(0,28px,0) rotate(-1.2deg) scale(.95)}52%{opacity:1;transform:translate3d(0,-6px,0) rotate(.35deg) scale(1.012)}76%{transform:translate3d(0,2px,0) rotate(-.12deg) scale(.998)}100%{opacity:1;transform:none}}

.stage:before,.stage:after{animation:patternDrift 12s cubic-bezier(.45,0,.55,1) infinite}

    <h1 class="name">歲歲</h1>
    <div class="role">VISUAL DESIGNER</div>
    <div class="line"></div>
    <p class="desc">視覺設計・插畫・動畫・UI/UX<br>把想法整理成看得見、用得上的體驗。</p>
    <button class="cta" onclick="buttonFeedback(this)">VIEW PORTFOLIO</button>
  </main>
  <div class="controls" aria-label="背景圖樣">
    <button class="dot" style="background:#b99380" onclick="changeBg('snack')" aria-label="零食圖樣"></button>
    <button class="dot" style="background:#9eaaa0" onclick="changeBg('animal')" aria-label="動物圖樣"></button>
    <button class="dot" style="background:#c39b98" onclick="changeBg('flower')" aria-label="花朵圖樣"></button>
  </div>
</div>
<script>
function changeBg(type){
  const body=document.body;
  body.classList.remove('snack','animal','flower');
  void body.offsetWidth;
  body.classList.add(type);
}
const card=document.querySelector('.card');
card.addEventListener('pointermove',(e)=>{
  const r=card.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5;
  const y=(e.clientY-r.top)/r.height-.5;
  const maxTilt=3.2;
  card.style.setProperty('--ry',(x*maxTilt)+'deg');
  card.style.setProperty('--rx',(-y*maxTilt)+'deg');
  card.style.setProperty('--mx',(x*2.5)+'px');
  card.style.setProperty('--my',(-8+y*1.5)+'px');
});
card.addEventListener('pointerleave',()=>{
  card.style.setProperty('--ry','0deg');
  card.style.setProperty('--rx','0deg');
  card.style.setProperty('--mx','0px');
  card.style.setProperty('--my','-8px');
});
function heartFeedback(btn){
  const active=btn.getAttribute('aria-pressed')==='true';
  btn.setAttribute('aria-pressed',String(!active));
  btn.textContent=active?'♡':'♥';
  btn.classList.remove('clicked');
  void btn.offsetWidth;
  btn.classList.add('clicked');
}
function buttonFeedback(btn){
  btn.classList.remove('clicked');
  void btn.offsetWidth;
  btn.classList.add('clicked');
  btn.textContent='THANK YOU ♡';
  clearTimeout(btn._timer);
  btn._timer=setTimeout(()=>{
    btn.textContent='VIEW PORTFOLIO';
    btn.classList.remove('clicked');
  },1000);
}
</script>
</body>
</html>
